<title>学习搭子</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css">
<link rel="stylesheet" href="/static/css/theme.css">
<link rel="stylesheet" href="/static/css/enhanced-ui.css">

<script src="/storage/vendor/marked.min.js?v=1"></script>
<script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
<script>
// 内联 KaTeX auto-render 简化版（不依赖 CDN 的 auto-render.min.js，避免网络失败导致公式不渲染）
window._renderMathInElement = function(element, options){
  if(typeof katex === 'undefined' || !element) return;
  options = options || {};
  var delims = options.delimiters || [{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}];
  var skipTags = {'script':1,'style':1,'pre':1,'code':1,'textarea':1};
  function walk(node){
    if(node.nodeType === 3){
      var text = node.textContent;
      if(!/\$|\\\(|\\\[/.test(text)) return;
      var best = null, bestIdx = Infinity;
      for(var i=0;i<delims.length;i++){
        var idx = text.indexOf(delims[i].left);
        if(idx !== -1 && idx < bestIdx){
          var end = text.indexOf(delims[i].right, idx + delims[i].left.length);
          if(end !== -1){bestIdx = idx; best = {idx: idx, end: end, delim: delims[i]};}
        }
      }
      if(best){
        var before = text.slice(0, best.idx);
        var math = text.slice(best.idx + best.delim.left.length, best.end);
        var after = text.slice(best.end + best.delim.right.length);
        var span = document.createElement(best.delim.display ? 'div' : 'span');
        span.style.display = best.delim.display ? 'block' : 'inline';
        try{span.innerHTML = katex.renderToString(math, {throwOnError: false, displayMode: !!best.delim.display});}catch(e){span.textContent = text.slice(best.idx, best.end + best.delim.right.length);}
        var parent = node.parentNode;
        if(before) parent.insertBefore(document.createTextNode(before), node);
        parent.insertBefore(span, node);
        if(after) parent.insertBefore(document.createTextNode(after), node);
        parent.removeChild(node);
        if(before) walk(parent.childNodes[Array.from(parent.childNodes).indexOf(span)-1]);
        if(after) walk(parent.childNodes[Array.from(parent.childNodes).indexOf(span)+1]);
      }
    }else if(node.nodeType === 1){
      var tag = node.tagName.toLowerCase();
      if(skipTags[tag] || node.classList.contains('katex')) return;
      Array.from(node.childNodes).forEach(walk);
    }
  }
  walk(element);
};
</script>
<script defer src="https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.min.js"></script>
<style>
/* CSS variables & animations moved to /static/css/theme.css */
*{box-sizing:border-box;margin:0;padding:0}
.katex { font-family: "Times New Roman", "STIX Two Math", serif !important; }
.katex .mathrm, .katex .textrm, .katex .text, .katex .textnormal { font-family: "Times New Roman", serif !important; }
.katex .mathit, .katex .textit { font-family: "Times New Roman", serif !important; font-style: italic !important; }
.katex .mathbf, .katex .textbf { font-family: "Times New Roman", serif !important; font-weight: bold !important; }
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--text);font-size:15px;transition:background .3s ease,color .15s ease;-webkit-tap-highlight-color:transparent;-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale}

.layout{display:flex;flex-direction:column;min-height:100vh}

/* === Top Bar (mobile only) === */
.topbar{display:none;position:sticky;top:0;z-index:100;background:var(--card-bg);border-bottom:1px solid var(--border);padding:0 12px;align-items:center;height:52px;gap:10px}
.topbar .sidebar-toggle{position:static;box-shadow:none;flex-shrink:0}
.topbar-home{font-size:16px;font-weight:700;flex:1;letter-spacing:1px;white-space:nowrap}

/* === Sidebar (desktop) === */
.sidebar{width:200px;background:var(--card-bg);border-right:1px solid var(--border);display:flex;flex-direction:column;position:fixed;top:0;left:-200px;bottom:0;z-index:500;transition:left .3s cubic-bezier(.25,.46,.45,.94);overflow-y:auto;box-shadow:var(--shadow)}
.sidebar.open{left:0}
.sidebar-logo{height:52px;display:flex;align-items:center;justify-content:center;font-size:16px;font-weight:700;border-bottom:1px solid var(--border);letter-spacing:1px;flex-shrink:0;position:relative}
.sidebar-close{display:none;position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:6px;background:transparent;border:1px solid transparent;cursor:pointer;color:var(--text2);align-items:center;justify-content:center}
.sidebar-nav{flex:1;padding:8px}
.sidebar-nav a{display:flex;align-items:center;padding:9px 12px;border-radius:6px;text-decoration:none;color:var(--text);transition:background .2s ease,color .15s ease,padding-left .2s ease;margin-bottom:2px;font-size:14px;position:relative}
.sidebar-nav a:hover{background:var(--hover);color:var(--text);font-weight:600;padding-left:16px}
.sidebar-nav a.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
.sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.3);z-index:400}
.sidebar-overlay.show{display:block}
.sidebar-toggle{position:fixed;top:14px;left:12px;z-index:501;width:34px;height:34px;border-radius:6px;background:var(--card-bg);border:1px solid var(--border);cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--text);box-shadow:var(--shadow-sm);transition:background .15s,opacity .15s,box-shadow .2s ease}
.sidebar-toggle:hover{background:var(--hover)}
.sidebar.open ~ .sidebar-toggle,.sidebar.open ~ .topbar #mobileSidebarToggle{opacity:.35}

/* === Main area === */
.main{margin-left:200px;flex:1;padding:24px;min-width:0;transition:margin .25s}
body.sb-closed .main{margin-left:0}
.header{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;flex-wrap:wrap;gap:8px}
.header h1{font-size:20px;font-weight:700}

/* === Cards === */
.card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
.card-title{font-size:15px;font-weight:600;margin-bottom:14px;color:var(--text)}

/* === Buttons === */
.btn{display:inline-flex;align-items:center;gap:5px;padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card-bg);cursor:pointer;font-size:13px;transition:all .2s ease;text-decoration:none;color:var(--text);white-space:nowrap;box-shadow:var(--shadow-sm)}
.btn:hover{background:var(--hover);border-color:#aaa;box-shadow:var(--shadow)}
.btn-primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:500}
.btn-primary:hover{opacity:.9;box-shadow:var(--shadow)}
.btn-danger{color:#c00;border-color:#e0b0b0}
.btn-danger:hover{background:#fff5f5;border-color:#c00}
.btn-info{color:#1565c0;border-color:#90caf9;background:#e3f2fd}
.btn-info:hover{background:#bbdefb;border-color:#64b5f6}
.btn-warn{color:#e65100;border-color:#ffcc80;background:#fff3e0}
.btn-warn:hover{background:#ffe0b2;border-color:#ffb74d}
[data-theme="dark"] .btn-info{color:#64b5f6;border-color:#2a4a6a;background:#1a2a3a}
[data-theme="dark"] .btn-info:hover{background:#12203a}
[data-theme="dark"] .btn-warn{color:#fb923c;border-color:#6a4a1a;background:#3a2a1a}
[data-theme="dark"] .btn-warn:hover{background:#2a1f12}
.btn-sm{padding:4px 10px;font-size:12px}
.btn-lg{padding:9px 20px;font-size:15px}

/* === Forms === */
.form-group{margin-bottom:12px}
.form-group label{display:block;font-weight:600;margin-bottom:3px;font-size:13px;color:var(--text2)}
.form-group input,.form-group select,.form-group textarea{width:100%;padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:14px;font-family:inherit;background:var(--card-bg);transition:border-color .15s}
.form-group input:focus,.form-group select:focus,.form-group textarea:focus{outline:none;border-color:var(--accent)}
.form-group select[multiple]{min-height:36px;max-height:120px}
.form-group textarea{resize:vertical;min-height:70px}
.row{display:flex;gap:14px;flex-wrap:wrap}
.row>*{flex:1;min-width:160px}

/* === Tags === */
.tag{display:inline-block;padding:1px 8px;border-radius:3px;font-size:12px;margin:2px 3px 2px 0;border:1px solid var(--border);background:var(--subtle)}
.badge{display:inline-block;padding:1px 6px;border-radius:3px;font-size:11px;font-weight:600}
.badge-done{background:#e8f5e9;color:#2e7d32}
.badge-pending{background:#f5f5f5;color:#666}
.badge-error{background:#ffebee;color:#c62828}

/* === Stats === */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:14px;margin-bottom:20px}
.stat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:20px;text-align:center;box-shadow:var(--shadow-sm)}
.stat-card .num{font-size:30px;font-weight:800;color:var(--accent);letter-spacing:-1px}
.stat-card .label{font-size:12px;color:var(--text2);margin-top:4px;letter-spacing:.5px}

/* === Tables === */
table{width:100%;border-collapse:collapse;font-size:13px}
table th,table td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--border)}
table th{background:var(--subtle);font-weight:600;white-space:nowrap}
table tr:hover{background:var(--subtle)}

/* === Upload === */
.upload-zone{border:2px dashed var(--border);border-radius:var(--radius);padding:30px;text-align:center;cursor:pointer;transition:all .25s ease;background:var(--subtle)}
.upload-zone:hover{border-color:var(--accent);background:var(--hover);transform:translateY(-1px);box-shadow:var(--shadow)}
.upload-zone p{margin:4px 0;color:var(--text2)}
.upload-zone .hint{font-size:12px;color:var(--text3)}

/* === Modal === */
.modal-overlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.4);z-index:600;align-items:center;justify-content:center}
.modal-overlay.show{display:flex}
.modal{background:var(--card-bg);border-radius:12px;padding:24px;max-width:900px;width:94%;max-height:88vh;overflow:auto;box-shadow:0 16px 48px rgba(0,0,0,.15);animation:scaleIn .2s ease both}
.modal h2{font-size:17px;margin-bottom:14px}
.modal-close{float:right;background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1}

/* === Toast 通知系统 === */
#toastContainer{position:fixed;top:16px;right:16px;z-index:1200;display:flex;flex-direction:column;gap:8px;pointer-events:none;max-width:min(360px,calc(100vw - 32px))}
.toast-item{display:flex;align-items:flex-start;gap:9px;padding:11px 16px 11px 12px;border-radius:10px;background:var(--card-bg);border:1px solid var(--border);box-shadow:var(--shadow-lg);font-size:13px;color:var(--text);pointer-events:auto;animation:toastSlideIn .32s cubic-bezier(.22,.61,.36,1) both;position:relative;overflow:hidden;line-height:1.5;word-break:break-word}
.toast-item::before{content:'';position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--toast-c,var(--accent))}
.toast-item.toast-out{animation:toastSlideOut .26s ease both}
.toast-icon{flex-shrink:0;width:18px;height:18px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;background:var(--toast-c,var(--accent));margin-top:1px}
.toast-item[data-type=ok]{--toast-c:var(--ok)}
.toast-item[data-type=error]{--toast-c:var(--err)}
.toast-item[data-type=warn]{--toast-c:var(--warn)}
.toast-item[data-type=info]{--toast-c:var(--accent)}
@keyframes toastSlideIn{from{opacity:0;transform:translateX(24px) scale(.96)}to{opacity:1;transform:translateX(0) scale(1)}}
@keyframes toastSlideOut{from{opacity:1;transform:translateX(0)}to{opacity:0;transform:translateX(24px) scale(.96)}}

/* === $confirm 确认弹窗 === */
.confirm-box{max-width:400px;padding:22px}
.confirm-box h3{font-size:15px;font-weight:700;margin-bottom:10px;color:var(--text)}
.confirm-box .confirm-msg{font-size:13.5px;color:var(--text2);line-height:1.65;margin-bottom:18px;word-break:break-word}
.confirm-box .confirm-actions{display:flex;justify-content:flex-end;gap:8px}
.confirm-box .btn-confirm-ok{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.confirm-box .btn-confirm-ok:hover{opacity:.9}
.confirm-box .btn-confirm-ok.danger{background:var(--err);border-color:var(--err)}

/* === Tabs === */
.tabs{display:flex;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;overflow-x:auto}
.tab{padding:8px 16px;cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500;color:var(--text2);font-size:13px;white-space:nowrap}
.tab.active{color:var(--accent);border-bottom-color:var(--accent)}
.tab-content{display:none}
.tab-content.active{display:block}
.tab-content img,.tab-content svg,.tab-content table,.tab-content div,.tab-content p{max-width:100%;height:auto;overflow-wrap:break-word;word-wrap:break-word}
.tab-content > *{max-width:100%;box-sizing:border-box}
.tab-content svg,.tab-content svg *{max-width:none;box-sizing:content-box}
.tab-content table{display:block;overflow-x:auto}
.tab-content pre{white-space:pre-wrap;overflow-x:auto}

/* === Misc === */
.alert{padding:10px 14px;border-radius:6px;margin-bottom:14px;font-size:13px;border:1px solid var(--border);background:var(--subtle);color:var(--text2)}
.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.empty{text-align:center;padding:40px 16px;color:var(--text3)}
pre.code{background:#2d2d2d;color:#ccc;padding:14px;border-radius:6px;overflow:auto;max-height:55vh;font-size:12px;white-space:pre-wrap}
.preview-frame{width:100%;min-height:500px;border:1px solid var(--border);border-radius:6px;background:#fff}
.diagram-box{margin:10px 0;text-align:center}
.diagram-box img,.diagram-box svg{max-width:100%;height:auto;border:1px solid var(--border);border-radius:4px}
.spin{display:inline-block;width:18px;height:18px;border:2px solid #e0e0e0;border-top-color:var(--accent);border-radius:50%;animation:spin .7s infinite linear}
@keyframes spin{to{transform:rotate(360deg)}}
/* Animations & component enhancements moved to /static/css/theme.css */

.ai-fab{position:fixed;right:20px;bottom:20px;width:50px;height:50px;border-radius:50%;background:var(--accent);color:var(--bg);display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;cursor:pointer;box-shadow:var(--shadow-lg);z-index:200;user-select:none}
/* ai-fab hover & transition in theme.css */
.detail-open .ai-fab{display:none !important}
#detailModal{z-index:601}

.block-tag{cursor:pointer;padding:3px 10px;font-size:13px;border-radius:4px;border:1px solid;transition:all .15s;display:inline-block;margin:2px;color:#fff}
.block-tag:hover{transform:translateY(-2px);box-shadow:0 2px 6px rgba(0,0,0,.15)}
.menu-group{cursor:pointer;display:flex;align-items:center;padding:9px 12px;border-radius:6px;text-decoration:none;color:var(--text);font-weight:600;font-size:14px;user-select:none}
.menu-group:hover{background:var(--hover)}
.menu-arrow{font-size:10px;margin-right:6px;transition:transform .2s;display:inline-block}
.menu-arrow.open{transform:rotate(90deg)}
.menu-sub{display:none;padding-left:16px}
.menu-sub.open{display:block}
.menu-sub a{display:flex;align-items:center;padding:6px 12px;border-radius:4px;text-decoration:none;color:var(--text2);font-size:13px;margin-bottom:1px}
.menu-sub a:hover,.menu-sub a.active{background:var(--hover);color:var(--accent);font-weight:600}
input[type=range]{flex:1}
input[type=radio]{margin-right:4px}

/* === Q&A === */
.qa-section{margin-bottom:18px}
.qa-section h3{font-size:15px;font-weight:600;margin-bottom:6px;color:var(--accent)}
.qa-section p{color:var(--text2);line-height:1.8;font-size:14px}

/* === Mobile === */
@media(max-width:768px){
  .topbar{display:flex}
  .sidebar{left:-280px;width:260px;box-shadow:2px 0 16px rgba(0,0,0,.18);padding-top:env(safe-area-inset-top)}
  .sidebar.open{left:0}
  .sidebar-logo{padding:0 46px 0 16px;justify-content:flex-start}
  .sidebar-close{display:flex}
  .sidebar-close:hover{background:var(--hover);color:var(--text)}
  #sidebarToggle{display:none}  /* hide desktop floating toggle on mobile */
  .main{margin-left:0;padding:12px;padding-bottom:max(12px,env(safe-area-inset-bottom))}
  body.sb-closed .main{margin-left:0}
  .header h1{font-size:17px}
  .card{padding:14px;margin-bottom:10px}
  .stats-grid{grid-template-columns:repeat(2,1fr);gap:8px}
  .stat-card{padding:12px}
  .stat-card .num{font-size:24px}
  .row>*{min-width:100%;flex:none}
  .upload-zone{padding:20px}
  table{font-size:12px}
  table th,table td{padding:6px 8px}
  .btn{padding:6px 12px;font-size:12px;min-height:40px}
  .modal{max-width:100%;width:100%;max-height:100vh;border-radius:0;padding:14px}
  .tab{padding:6px 12px;font-size:12px}
  #globalChatPanel{width:100vw;max-width:100vw}
  #agentMsgs{min-height:200px;max-height:50vh}
  /* 移动端手势：侧栏打开时从边缘右滑关闭 */
  .sidebar.open{touch-action:pan-y}
}
#globalChatPanel{position:fixed;right:0;top:0;bottom:0;width:360px;max-width:100vw;background:var(--card-bg);border-left:1px solid var(--border);z-index:300;display:none;flex-direction:column;box-shadow:-4px 0 12px rgba(0,0,0,.1)}
#globalChatPanel.open{display:flex}
.chat-header{display:flex;justify-content:space-between;align-items:center;padding:12px;border-bottom:1px solid var(--border)}
.chat-header h3{margin:0;font-size:15px}
.chat-body{flex:1;overflow:auto;padding:12px;font-size:13px}
.chat-input-area{padding:8px;border-top:1px solid var(--border);display:flex;gap:6px}
.chat-input-area input{flex:1;padding:8px;border:1px solid var(--border);border-radius:6px;font-size:13px}

@media(max-width:480px){
  .stats-grid{grid-template-columns:1fr}
  .header{flex-direction:column;align-items:flex-start}
}

/* ── Dark Mode Overrides ── */
[data-theme="dark"] .btn-primary{background:var(--accent);color:#fff;border-color:var(--accent)}
[data-theme="dark"] .btn-primary:hover{filter:brightness(1.1);color:#fff}
[data-theme="dark"] .btn-danger:hover{background:#3a1a1a}
[data-theme="dark"] .badge-done{background:#1a3a1a;color:#6b6}
[data-theme="dark"] .badge-pending{background:#333;color:#999}
[data-theme="dark"] .badge-error{background:#3a1a1a;color:#f66}
[data-theme="dark"] .ai-fab{color:#fff}
[data-theme="dark"] .sidebar-toggle{box-shadow:0 1px 4px rgba(0,0,0,.3)}
[data-theme="dark"] .modal{box-shadow:0 4px 24px rgba(0,0,0,.5)}
[data-theme="dark"] .editor-toast{background:#e0e0e0;color:#1a1a1e}
[data-theme="dark"] .spin{border-color:#444;border-top-color:var(--accent)}
[data-theme="dark"] pre.code{background:#111;color:#ddd}
[data-theme="dark"] input,
[data-theme="dark"] select,
[data-theme="dark"] textarea{background:var(--card-bg);color:var(--text)}
[data-theme="dark"] input:focus,
[data-theme="dark"] select:focus,
[data-theme="dark"] textarea:focus{border-color:var(--accent)}
[data-theme="dark"] .palette-cats button{background:#2a2a2f}
[data-theme="dark"] .palette-cats button.active{background:var(--accent);color:#fff}
[data-theme="dark"] .palette-item:hover{background:#3a3a3f}
[data-theme="dark"] .editor-canvas-wrap .canvas-area{background:#f0ebe0}
[data-theme="dark"] .canvas-area svg{background:#fff;box-shadow:0 2px 8px rgba(0,0,0,.08)}
[data-theme="dark"] .diagram-box svg,[data-theme="dark"] .diagram-box img,[data-theme="dark"] .mermaid svg{filter:invert(0.9) hue-rotate(180deg)}
[data-theme="dark"] .calibration-badge.active{background:#1a3a1a;color:#6b6}
[data-theme="dark"] .calibration-badge.pending{background:#3a2a1a;color:#fb0}
[data-theme="dark"] .component-in-canvas.group-locked .lock-indicator{fill:rgba(100,200,100,0.1);stroke:#6b6!important}
[data-theme="dark"] .chat-body{color:var(--text)}
[data-theme="dark"] .chat-input-area input{background:var(--bg);color:var(--text);border-color:var(--border)}
[data-theme="dark"] .sidebar-overlay{background:rgba(0,0,0,.6)}
[data-theme="dark"] .ai-fab{box-shadow:0 3px 12px rgba(0,0,0,.5)}
[data-theme="dark"] .preview-frame{background:var(--bg)}
[data-theme="dark"] .upload-card{background:#2a2a2f;border-color:#555}
[data-theme="dark"] .upload-card:hover{border-color:var(--accent);background:#333}
[data-theme="dark"] .upload-status.processing{background:#3a2a1a!important;color:#fb0!important}
[data-theme="dark"] .upload-status.ok{background:#1a3a1a!important;color:#6b6!important}
[data-theme="dark"] .upload-status.error{background:#3a1a1a!important;color:#f66!important}

[data-theme="dark"] .diagram-link{background:#333;color:var(--text)}
[data-theme="dark"] .diagram-link:hover{background:#3a3a3f}
[data-theme="dark"] #agentMsgs{background:#1a1a1e}
[data-theme="dark"] button:not(.btn):not(.accent-opt):not(.modal-close){color:var(--text)}
[data-theme="dark"] .agent-msg-ai{background:var(--hover)}
[data-theme="dark"] .chat-body{color:var(--text)}

/* ── status-level colors for diagnostics / agent ── */
.status-ok{background:#e8f5e9;color:#2e7d32}
.status-warn{background:#fff3e0;color:#e65100}
.status-error{background:#ffebee;color:#c62828}
.status-info{background:var(--subtle);color:var(--text)}
.agent-msg-ai{background:var(--hover);padding:8px;border-radius:6px;margin:2px 0 8px 0}
.agent-msg-user{color:var(--accent);margin:6px 0 2px 0}
[data-theme="dark"] .status-ok{background:#1a3a1a;color:#6b6}
[data-theme="dark"] .status-warn{background:#3a2a1a;color:#fb0}
[data-theme="dark"] .status-error{background:#3a1a1a;color:#f66}
[data-theme="dark"] .quote-mark{opacity:0.18}

/* ── system messages on dashboard ── */
.sys-msg{display:flex;gap:10px;padding:10px 12px;border-bottom:1px solid var(--border);transition:background .15s}
.sys-msg:hover{background:var(--hover)}
.sys-msg-unread{background:var(--subtle);border-left:3px solid var(--accent)}
.sys-type{flex-shrink:0;width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.sys-type-S{background:#e3f2fd;color:#1565c0}
.sys-type-A{background:#fce4ec;color:#c62828}
.sys-type-Q{background:#fff3e0;color:#e65100}
.sys-body{flex:1;min-width:0}
.sys-title{font-size:13px;font-weight:600}
.sys-content{font-size:13px;color:var(--text2);margin:2px 0 4px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.sys-time{font-size:11px;color:var(--text3)}
.sys-del{cursor:pointer;font-size:12px;color:var(--text3);transition:color .15s;align-self:flex-start;flex-shrink:0;background:none;border:none;padding:2px 4px;border-radius:4px}
.sys-del:hover{color:var(--text);background:var(--hover)}
.sys-empty{padding:20px;text-align:center;color:var(--text3);font-size:13px}
.sys-header{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);font-size:14px;font-weight:600}
.sys-badge{background:var(--accent);color:var(--bg);font-size:11px;padding:1px 6px;border-radius:10px;font-weight:700}

<script>
// Accent color dynamic injection (globals only — init deferred to after $API)
var ACCENT_PRESETS={
  'steel':{light:'#2b5aed',dark:'#6d8bff',grad:'linear-gradient(135deg,#2b5aed 0%,#4a7bff 100%)',grad_dark:'linear-gradient(135deg,#4a6bff 0%,#6d8bff 100%)'},
  'amber':{light:'#e6a200',dark:'#ffc107',grad:'linear-gradient(135deg,#e6a200 0%,#ffc107 100%)',grad_dark:'linear-gradient(135deg,#d4a000 0%,#ffc107 100%)'},
  'jade':{light:'#16a34a',dark:'#66bb6a',grad:'linear-gradient(135deg,#16a34a 0%,#66bb6a 100%)',grad_dark:'linear-gradient(135deg,#2e7d32 0%,#66bb6a 100%)'},
  'mint':{light:'#0097a7',dark:'#26c6da',grad:'linear-gradient(135deg,#0097a7 0%,#26c6da 100%)',grad_dark:'linear-gradient(135deg,#00838f 0%,#26c6da 100%)'},
  'rose':{light:'#c62828',dark:'#ef5350',grad:'linear-gradient(135deg,#c62828 0%,#ef5350 100%)',grad_dark:'linear-gradient(135deg,#b71c1c 0%,#ef5350 100%)'},
  'violet':{light:'#7b1fa2',dark:'#ab47bc',grad:'linear-gradient(135deg,#7b1fa2 0%,#ab47bc 100%)',grad_dark:'linear-gradient(135deg,#6a1b9a 0%,#ab47bc 100%)'},
};
function _isValidHex(h){return /^#[0-9a-fA-F]{6}$/.test(h)}
function _hexToRgba(hex,a){var r=parseInt(hex.slice(1,3),16),g=parseInt(hex.slice(3,5),16),b=parseInt(hex.slice(5,7),16);return 'rgba('+r+','+g+','+b+','+a+')'}
function _lighten(hex,amt){var r=Math.min(255,parseInt(hex.slice(1,3),16)+Math.round(255*amt));var g=Math.min(255,parseInt(hex.slice(3,5),16)+Math.round(255*amt));var b=Math.min(255,parseInt(hex.slice(5,7),16)+Math.round(255*amt));return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0')}
function _darken(hex,amt){var r=Math.max(0,parseInt(hex.slice(1,3),16)-Math.round(255*amt));var g=Math.max(0,parseInt(hex.slice(3,5),16)-Math.round(255*amt));var b=Math.max(0,parseInt(hex.slice(5,7),16)-Math.round(255*amt));return '#'+r.toString(16).padStart(2,'0')+g.toString(16).padStart(2,'0')+b.toString(16).padStart(2,'0')}
function applyAccentColor(name,customLight,customDark){
  var root=document.documentElement;
  var preset=ACCENT_PRESETS[name];
  if(name==='custom'){
    var l=customLight||'#2b5aed';
    var d=customDark||_darken(l,.10);
    if(!_isValidHex(l)||(!_isValidHex(d)&&customDark)){$toast('HEX格式应为 #RRGGBB','error');return}
    if(!_isValidHex(d)){d=_darken(l,.10)}
    var gradL='linear-gradient(135deg,'+l+' 0%,'+_lighten(l,.15)+' 100%)';
    var gradD='linear-gradient(135deg,'+_darken(d,.10)+' 0%,'+d+' 100%)';
    var isDark=root.getAttribute('data-theme')==='dark';
    root.style.setProperty('--accent',isDark?d:l);
    root.style.setProperty('--accent-soft',_hexToRgba(isDark?d:l,.12));
    root.style.setProperty('--accent-glow',_hexToRgba(isDark?d:l,.25));
    root.style.setProperty('--grad-accent',isDark?gradD:gradL);
  }else if(preset){
    var isDark=root.getAttribute('data-theme')==='dark';
    root.style.setProperty('--accent',isDark?preset.dark:preset.light);
    root.style.setProperty('--accent-soft',_hexToRgba(isDark?preset.dark:preset.light,.12));
    root.style.setProperty('--accent-glow',_hexToRgba(isDark?preset.dark:preset.light,.25));
    root.style.setProperty('--grad-accent',isDark?preset.grad_dark:preset.grad);
  }else{
    root.style.removeProperty('--accent');
    root.style.removeProperty('--accent-soft');
    root.style.removeProperty('--accent-glow');
    root.style.removeProperty('--grad-accent');
  }
  localStorage.setItem('accent_color',name||'');
  localStorage.setItem('accent_custom_light',customLight||'');
  localStorage.setItem('accent_custom_dark',customDark||'');
}
// Immediate apply from localStorage (no API needed)
(function(){var n=localStorage.getItem('accent_color')||'';if(n){applyAccentColor(n,localStorage.getItem('accent_custom_light')||'',localStorage.getItem('accent_custom_dark')||'')}})();
// Re-apply accent when theme toggles
window.addEventListener('themeChanged',function(){var n=localStorage.getItem('accent_color')||'';if(n){applyAccentColor(n,localStorage.getItem('accent_custom_light')||'',localStorage.getItem('accent_custom_dark')||'')}});
</script>

window.$API = {
  _parse: function(r,type){
    if(!r.ok){
      return r.text().then(function(t){
        var detail='';
        try{var d=JSON.parse(t);detail=typeof d.detail==='string'?d.detail:(d.message||'');}catch(e){}
        if(detail) throw new Error(detail);
        throw new Error(r.status+' '+r.statusText+': '+(t||'').slice(0,100));
      });
    }
    if(type==='json')return r.json();return r.text()
  },
  get: function(u){return fetch(u).then(function(r){return window.$API._parse(r,'json')})},
  post: function(u,d){return fetch(u,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return window.$API._parse(r,'json')})},
  upload: function(u,f){return fetch(u,{method:'POST',body:f}).then(function(r){return window.$API._parse(r,'json')})},
  put: function(u,d){return fetch(u,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify(d)}).then(function(r){return window.$API._parse(r,'json')})},
  del: function(u){return fetch(u,{method:'DELETE'}).then(function(r){return window.$API._parse(r,'json')})},
  delete: function(u){return fetch(u,{method:'DELETE'}).then(function(r){return window.$API._parse(r,'json')})}
};
function $fmt(t){if(!t)return'-';var d=new Date(t);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0')}
function $status(s){var m={done:'<span class="badge badge-done">OK</span>',staged:'<span class="badge badge-pending">Staged</span>',pending:'<span class="badge badge-pending">...</span>',processing:'<span class="badge badge-pending">...</span>',generating_solution:'<span class="badge badge-pending">...</span>',error:'<span class="badge badge-error">ERR</span>'};return m[s]||'<span class="badge">'+s+'</span>'}

var _toastIcons={ok:'\u2713',error:'\u2715',warn:'!',info:'i'};
function $toast(m,t){
  t=(t==='error'||t==='ok'||t==='warn')?t:'info';
  var c=document.getElementById('toastContainer');
  if(!c){c=document.createElement('div');c.id='toastContainer';document.body.appendChild(c)}
  while(c.children.length>=4)c.firstChild.remove();
  var e=document.createElement('div');
  e.className='toast-item';e.dataset.type=t;
  var ic=document.createElement('span');ic.className='toast-icon';ic.textContent=_toastIcons[t];
  var tx=document.createElement('span');tx.textContent=m;
  e.appendChild(ic);e.appendChild(tx);
  e.onclick=function(){_dismissToast(e)};
  c.appendChild(e);
  setTimeout(function(){_dismissToast(e)},t==='error'?4000:2800);
}
function _dismissToast(e){
  if(!e||e._dismissed)return;e._dismissed=true;
  e.classList.add('toast-out');
  setTimeout(function(){e.remove()},260);
}
/* Promise 风格确认弹窗：if(!await $confirm('确定删除？',{danger:true}))return; */
function $confirm(msg,opts){
  opts=opts||{};
  return new Promise(function(resolve){
    document.querySelectorAll('.confirm-overlay').forEach(function(o){o.remove()});
    var ov=document.createElement('div');
    ov.className='modal-overlay show confirm-overlay';
    var box=document.createElement('div');
    box.className='modal confirm-box';
    box.setAttribute('role','dialog');box.setAttribute('aria-modal','true');
    var h=document.createElement('h3');h.textContent=opts.title||'确认操作';
    var p=document.createElement('div');p.className='confirm-msg';p.textContent=msg;
    var acts=document.createElement('div');acts.className='confirm-actions';
    var cancel=document.createElement('button');cancel.className='btn btn-sm';cancel.textContent=opts.cancelText||'取消';
    var ok=document.createElement('button');ok.className='btn btn-sm btn-confirm-ok'+(opts.danger?' danger':'');ok.textContent=opts.okText||'确认';
    acts.appendChild(cancel);acts.appendChild(ok);
    box.appendChild(h);box.appendChild(p);box.appendChild(acts);
    ov.appendChild(box);document.body.appendChild(ov);
    function done(v){ov.remove();document.removeEventListener('keydown',onKey,true);resolve(v)}
    function onKey(e){
      if(e.key==='Escape'){e.stopPropagation();done(false)}
      else if(e.key==='Enter'){e.preventDefault();e.stopPropagation();done(true)}
    }
    cancel.onclick=function(){done(false)};
    ok.onclick=function(){done(true)};
    ov.onclick=function(e){if(e.target===ov)done(false)};
    document.addEventListener('keydown',onKey,true);
    ok.focus();
  });
}
function _fixLatex(html){
  if(!html) return html;
  // 先保护 HTML 标签，避免正则误匹配到属性中的 _ 或 ^
  var tagHolders=[], tagIdx=0, saveTag=function(s){tagHolders.push(s);return '<!--TAG-'+(tagIdx++)+'-->';};
  html=html.replace(/<[^>]+>/g, saveTag);
  // 先保护代码块、行内代码、Markdown 链接、图片、粗体、斜体、删除线，避免把 ^ _ 误当成数学公式
  // 占位符使用 "-N" 而非 "_N"，防止被后续的 _/^ 数学正则误匹配
  var placeholders=[], idx=0, save=function(s){placeholders.push(s);return '<!--LTX-'+(idx++)+'-->';};
  // 把转义的 \$ 替换为 HTML 实体，防止后续被当成公式分隔符
  html=html.replace(/\\\$/g,'&#36;');
  html=html.replace(/```[\s\S]*?```/g,save);
  html=html.replace(/`[^`]+`/g,save);
  html=html.replace(/!\[[^\]]*\]\([^)]+\)/g,save);
  html=html.replace(/\[[^\]]*\]\([^)]+\)/g,save);
  html=html.replace(/(\*\*|__)[^*_]+(\*\*|__)/g,save);
  html=html.replace(/(\*|_)[^*_]+(\*|_)/g,save);
  html=html.replace(/~~[^~]+~~/g,save);
  // 1. 仅当文本中只有单个孤立 $ 时才移除，避免破坏合法的多 $ 公式
  var dollarCount=(html.match(/\$/g)||[]).length;
  if(dollarCount===1){
    // 若唯一的 $ 位于开头或末尾且独立存在，则移除
    html=html.replace(/^\$\s+|\s+\$$/g,'');
  }
  // 2. 对明确的数学片段自动补 $...$：仅对上标场景（^）做自动包裹；
  // 下划线 _ 极容易误伤 snake_case、Markdown 斜体等普通文本，不再自动补 $
  html=html.replace(/([^$\w])([a-zA-Z0-9]+\^[a-zA-Z0-9{}]+)([^$\w])/g,function(m,pre,math,post){
    return pre+'$'+math+'$'+post;
  });
  // 恢复占位
  html=html.replace(/<!--LTX-(\d+)-->/g,function(m,i){return placeholders[+i]||m;});
  // 恢复 HTML 标签
  html=html.replace(/<!--TAG-(\d+)-->/g,function(m,i){return tagHolders[+i]||m;});
  return html;
}
function $md(t,e){
  if(typeof marked==='undefined'){console.warn('$md: marked not loaded, using fallback');e.innerHTML='<pre style="white-space:pre-wrap;font-size:13px">'+String(t||'').replace(/</g,'&lt;')+'</pre>';return}
  try{t=String(t||'');
    t=_fixLatex(t);
    // Preserve mermaid blocks before marked touches them
    var mermaidBlocks=[];
    t=t.replace(/```mermaid\s*([\s\S]*?)```/g,function(m,c){mermaidBlocks.push(c);return'<!--MERMAID_BLOCK_'+(mermaidBlocks.length-1)+'-->'});
    t=t.replace(/```math\s*([\s\S]*?)```/g,'$$$$$1$$$$').replace(/```latex\s*([\s\S]*?)```/g,'$$$$$1$$$$');
    var parser = (typeof marked.parse === 'function') ? marked.parse : marked;
    var h=parser(t);
    if(!h||h.trim()===''){e.innerHTML='<pre style="white-space:pre-wrap;font-size:13px">'+String(t||'').replace(/</g,'&lt;')+'</pre>';return}
    // Restore mermaid placeholders
    h=h.replace(/<!--MERMAID_BLOCK_(\d+)-->/g,function(m,i){return '<div class="mermaid">'+mermaidBlocks[+i]+'</div>'});
    // 简单 XSS 消毒：移除危险标签和事件属性、危险 URL 协议
    function _sanitizeHtml(html){
      if(!html) return html;
      // 前置过滤：针对事件属性编码绕过（如 onerror&#61;）做防御性替换。
      // 只在疑似事件属性上下文中替换等号/引号等危险字符实体，减少误伤合法数字实体。
      html=html.replace(/(on\w+\s*)(&#(x?[0-9a-fA-F]+);)([^>]*>)/gi,function(m,prefix,entity,code,suffix){
        var c=code.charAt(0)==='x'||code.charAt(0)==='X'?parseInt(code.slice(1),16):parseInt(code,10);
        if(isNaN(c)) return m;
        if(c===61||c===34||c===39||c===96) return prefix+' '+suffix;
        return prefix+String.fromCharCode(c)+suffix;
      });
      html=html.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi,'');
      html=html.replace(/on\w+\s*=\s*["']?[^"'>\s]*/gi,'');
      html=html.replace(/(?:href|src|srcset|action|formaction)\s*=\s*["']?\s*(?:javascript:|data:|vbscript:|file:|about:)[^"'>\s]*/gi,'');
      var div=document.createElement('div');div.innerHTML=html;
      var badTags=['script','style','iframe','object','embed','form','input','textarea','button'];
      badTags.forEach(function(tag){Array.from(div.getElementsByTagName(tag)).forEach(function(el){el.remove()})});
      Array.from(div.querySelectorAll('*')).forEach(function(el){
        for(var i=el.attributes.length-1;i>=0;i--){
          var name=el.attributes[i].name.toLowerCase();
          var val=(el.attributes[i].value||'').toLowerCase().trim();
          if(name.indexOf('on')===0 || name==='srcdoc'){el.removeAttribute(name);continue}
          if((name==='href'||name==='src'||name==='srcset'||name==='action'||name==='formaction') && /^(javascript|data|vbscript|file|about):/.test(val)){
            el.removeAttribute(name);
          }
        }
      });
      return div.innerHTML;
    }
    h=_sanitizeHtml(h);
    e.innerHTML=h;
    // Render Mermaid
    if(typeof mermaid!=='undefined'){
      var mn=e.querySelectorAll('.mermaid');
      if(mn.length){mermaid.run({nodes:Array.from(mn)}).catch(function(ex){console.warn('mermaid render fail',ex)})}
    }
    // KaTeX rendering
    var tries=0, maxTries=60, hasRaw=function(d){return /\$(?!\()/.test(d.innerHTML)};
    function _km(){
      tries++;
      var renderer = (typeof renderMathInElement!=='undefined') ? renderMathInElement : window._renderMathInElement;
      if(typeof katex!=='undefined' && renderer){
        try{renderer(e,{delimiters:[{left:'$$',right:'$$',display:true},{left:'$',right:'$',display:false},{left:'\\(',right:'\\)',display:false},{left:'\\[',right:'\\]',display:true}],throwOnError:false})}catch(ex){}
        if(tries<maxTries&&hasRaw(e)){requestAnimationFrame(function(){setTimeout(_km,80)})}
      }else if(tries<maxTries){setTimeout(_km,100)}
    }

// ===== Undo/Recycle Bin System =====
var UNDO_KEY='study_buddy_undo';
function saveUndo(action,questionId,oldData){
  try{
    var items=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]');
    items.unshift({id:Date.now(),action:action,question_id:questionId,old_data:oldData,timestamp:new Date().toISOString()});
    if(items.length>50)items=items.slice(0,50);
    localStorage.setItem(UNDO_KEY,JSON.stringify(items));
    $toast('已保存撤销点','ok');
  }catch(e){}
}
function undoLast(){
  try{
    var items=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]');
    if(!items.length){$toast('没有可撤销的操作','error');return}
    var last=items[0];
    window.$API.put('/api/questions/'+encodeURIComponent(last.question_id),last.old_data).then(function(){
      items.shift();
      localStorage.setItem(UNDO_KEY,JSON.stringify(items));
      $toast('已撤销: '+last.action,'ok');
    }).catch(function(e){$toast('撤销失败: '+e.message,'error')})
  }catch(e){$toast('撤销失败: '+e.message,'error')}
}
function showUndoHistory(){
  try{
    var items=JSON.parse(localStorage.getItem(UNDO_KEY)||'[]');
    if(!items.length){$toast('撤销历史为空','error');return}
    var html='<div style="max-height:400px;overflow:auto">';
    html+='<table style="width:100%;font-size:12px"><thead><tr><th>操作</th><th>题目ID</th><th>时间</th></tr></thead><tbody>';
    items.forEach(function(item){
      var d=new Date(item.timestamp);
      var ts=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')+' '+String(d.getHours()).padStart(2,'0')+':'+String(d.getMinutes()).padStart(2,'0');
      html+='<tr><td>'+item.action+'</td><td style="font-family:monospace;font-size:11px">'+(item.question_id||'').slice(0,12)+'</td><td>'+ts+'</td></tr>';
    });
    html+='</tbody></table></div>';
    var modal=document.createElement('div');modal.className='modal-overlay show';modal.style.cssText='display:flex';
    modal.innerHTML='<div class="modal" style="max-width:500px"><button class="modal-close" onclick="this.closest(\'.modal-overlay\').remove()">&times;</button><h2>撤销历史</h2>'+html+'<div style="margin-top:12px"><button class="btn btn-sm" onclick="undoLast();this.closest(\'.modal-overlay\').remove()">撤销最近一次</button></div></div>';
    document.body.appendChild(modal);
  }catch(e){$toast('显示历史失败: '+e.message,'error')}
}

  }
  window.dispatchEvent(new Event('themeChanged'));
}
// Auto dark mode by time (UTC+8)
function checkAutoTheme(){
  // Skip if user manually toggled
  if(localStorage.getItem('theme_manual')==='true')return;
  var darkSettings = null;
  try { darkSettings = JSON.parse(localStorage.getItem('theme_auto_settings')||'null'); } catch(e){}
  if(!darkSettings){
    window.$API.get('/api/settings').then(function(s){
      if(!s||!s.dark_mode_auto)return;
      var cfg = {auto:s.dark_mode_auto,start:s.dark_mode_start||'18:00',end:s.dark_mode_end||'06:00'};
      localStorage.setItem('theme_auto_settings',JSON.stringify(cfg));
      _applyAutoTheme(cfg);
    }).catch(function(){});
    return;
  }
  if(!darkSettings.auto)return;
  _applyAutoTheme(darkSettings);
}
function _applyAutoTheme(cfg){
  var now=new Date();
  var utc=new Date(now.getTime()+now.getTimezoneOffset()*60000+8*3600000);
  var hm=String(utc.getHours()).padStart(2,'0')+':'+String(utc.getMinutes()).padStart(2,'0');
  var shouldBeDark=false;
  if(cfg.start<=cfg.end){ shouldBeDark=hm>=cfg.start&&hm<=cfg.end; }
  else{ shouldBeDark=hm>=cfg.start||hm<=cfg.end; }
  var isDark=document.documentElement.getAttribute('data-theme')==='dark';
  if(shouldBeDark&&!isDark){
    document.documentElement.setAttribute('data-theme','dark');
    localStorage.setItem('theme','dark');
    document.getElementById('themeLabel').textContent='亮色';
  }else if(!shouldBeDark&&isDark){
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('theme','light');
    document.getElementById('themeLabel').textContent='暗黑';
  }
  if(shouldBeDark!==isDark){window.dispatchEvent(new Event('themeChanged'))}
}
(function(){
  if(document.documentElement.getAttribute('data-theme')==='dark'){
    document.getElementById('themeLabel').textContent='亮色';
  }
  // Check auto theme on load and every minute
  checkAutoTheme();
  setInterval(checkAutoTheme,60000);
})();

// ===== 全局前端错误自动上报 =====
(function(){
  var _reported=new Set();
  function _log(err,kind){
    var msg=err&&err.message?err.message:String(err||'');
    var key=(msg||'').slice(0,80)||('_'+typeof err);
    if(_reported.has(key))return;  // 去重，同类错误只报一次
    _reported.add(key);
    var detail='';
    try{detail=(err&&err.stack||'').slice(0,500)}catch(e){}
    var payload=JSON.stringify({error:msg,stack:detail,kind:kind||'error',page:location.pathname});
    // Use fetch with keepalive instead of sendBeacon (sendBeacon sends text/plain)
    fetch('/api/log-frontend-error',{method:'POST',headers:{'Content-Type':'application/json'},body:payload,keepalive:true}).catch(function(){})
  }
  // 用 addEventListener 替代直接赋值，避免覆盖其他处理器
  window.addEventListener('error',function(e){
    if(!e||!e.error){return}  // 跳过资源加载错误 (无 e.error)
    _log(e.error,'error');
  });
  window.addEventListener('unhandledrejection',function(e){
    if(e&&e.reason){
      _log(e.reason instanceof Error?e.reason:{message:typeof e.reason==='string'?e.reason:String(e.reason)},'unhandledrejection');
    }
  });
})();
