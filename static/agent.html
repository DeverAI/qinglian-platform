</head>
<body>
<header>
  <nav id="mainNav">
    <a href="/" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="navLogoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <path fill="url(#navLogoGrad)" d="M32 4 L56 14 V32 C56 46 46 56 32 60 C18 56 8 46 8 32 V14 Z"/>
        <circle cx="32" cy="26" r="5" fill="#fff"/>
        <circle cx="20" cy="40" r="2.6" fill="#fff"/>
        <circle cx="44" cy="40" r="2.6" fill="#fff"/>
        <path d="M32 31 L20 40 L32 46 L44 40 Z" fill="none" stroke="#fff" stroke-width="2"/>
      </svg>
      <span>青联合规监督社区</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>

    <div class="nav-links" id="navLinks">
      <a href="/">首页</a>
      <a href="/tasks.html" data-module="tasks">任务</a>

      <a href="/knowledge.html" data-module="knowledge">知识库</a>
      <a href="/quiz.html">条文背诵</a>
      <a href="/emails.html" data-module="emails">邮件代发</a>
      <a href="/rankings.html" data-module="points">排行榜</a>
      <a href="/agent.html" data-module="ai_agent">AI导游</a>
      <a href="/disclaimer.html">免责声明</a>
      <span id="nav-user"></span>
    </div>
  </nav>
</header>
<div class="container anim-in">
  <div class="page-header">
    <div class="page-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <rect x="3" y="11" width="18" height="10" rx="2"/>
        <circle cx="12" cy="5" r="2"/>
        <path d="M12 7v4"/>
        <line x1="8" y1="16" x2="8" y2="16"/>
        <line x1="16" y1="16" x2="16" y2="16"/>
      </svg>
    </div>
    <div>
      <h1>AI 导游</h1>
      <div class="page-subtitle">基于项目设计文档的智能问答助手</div>
    </div>
  </div>
  <div class="card">
    <p class="muted">AI 导游仅依据《Design.md》原文回答项目相关问题；超出范围的需求会被记录到 Future.md。</p>
    <div id="chat" class="chat-window">
      <div class="chat-empty muted">请输入你的问题...</div>
    </div>
    <div class="form-row">
      <input id="question" placeholder="例如：这个社区是做什么的？" class="chat-input">
      <button id="send" class="btn btn-primary">发送</button>
    </div>
  </div>
  <div class="card">
    <h2>提交未来需求</h2>
    <p class="muted">如果你有合理的功能建议，可以直接记录到 Future.md，由管理员评估。</p>
    <textarea id="future-content" placeholder="请描述你的建议..."></textarea>
    <div class="btn-group">
      <button id="future-submit" class="btn btn-primary">提交建议</button>
    </div>
    <p id="future-msg" class="muted"></p>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
function addMessage(role, text) {
  const chat = document.getElementById('chat');
  const empty = chat.querySelector('.chat-empty');
  if (empty) empty.remove();
  const div = document.createElement('div');
  div.className = 'chat-message ' + (role === 'user' ? 'chat-user' : 'chat-agent');
  div.innerHTML = `<div class="chat-role">${role === 'user' ? '你' : 'AI导游'}</div><div class="chat-text">${renderMarkdown(text)}</div>`;
  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
}

document.getElementById('send').addEventListener('click', async () => {
  const input = document.getElementById('question');
  const q = input.value.trim();
  if (!q) return;
  addMessage('user', q);
  input.value = '';
  const res = await postJson('/agent/chat', { question: q }, false);
  if (res.code === 0) {
    addMessage('agent', res.data.reply);
  } else {
    addMessage('agent', '出错：' + res.message);
  }
});

document.getElementById('question').addEventListener('keydown', e => { if (e.key === 'Enter') document.getElementById('send').click(); });

document.getElementById('future-submit').addEventListener('click', async () => {
  const content = document.getElementById('future-content').value.trim();
  if (!content) return;
  const res = await postJson('/agent/future', { content }, false);
  if (res.code === 0) {
    showToast('已记录，感谢建议', 'success');
    document.getElementById('future-content').value = '';
  } else {
    showToast(res.message, 'error');
  }
});
</script>
</body>
</html>
