<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>排行榜 - 青联合规监督社区</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header>
  <nav id="mainNav">
    <a href="/" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="navLogoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <path fill="url(#navLogoGrad)" d="M32 4 L56 14 V32 C56 46 46 56 32 60 C18 56 8 46 8 32 V14 Z"/>
        <circle cx="32" cy="26" r="5" fill="#fff"/>
        <circle cx="20" cy="40" r="2.6" fill="#fff"/>
        <circle cx="44" cy="40" r="2.6" fill="#fff"/>
        <path d="M32 31 L20 40 L32 46 L44 40 Z" fill="none" stroke="#fff" stroke-width="2"/>
      </svg>
      <span>青联合规监督社区</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="/">首页</a>
      <a href="/tasks.html" data-module="tasks">任务</a>
      <a href="/forum.html" data-module="forum">论坛</a>
      <a href="/knowledge.html" data-module="knowledge">知识库</a>
      <a href="/quiz.html">条文背诵</a>
      <a href="/emails.html" data-module="emails">邮件代发</a>
      <a href="/rankings.html" data-module="points">排行榜</a>
      <a href="/agent.html" data-module="ai_agent">AI导游</a>
      <a href="/disclaimer.html">免责声明</a>
      <span id="nav-user"></span>
    </div>
  </nav>
</header>
<div class="container anim-in">
  <div class="page-header">
    <div class="page-icon">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="8" r="7"/>
        <polyline points="8.21 13.89 7 23 12 20 17 23 15.79 13.88"/>
      </svg>
    </div>
    <div>
      <h1>积分排行榜</h1>
      <div class="page-subtitle">表彰为社区合规监督做出贡献的成员</div>
    </div>
  </div>
  <div class="card">
    <div class="tabs">
      <span class="tab active" data-type="week">周榜</span>
      <span class="tab" data-type="month">月榜</span>
      <span class="tab" data-type="total">总榜</span>
    </div>
    <div class="table-scroll">
      <table>
        <thead><tr><th>排名</th><th>用户</th><th>积分</th></tr></thead>
        <tbody id="rank-body"><tr><td colspan="3" class="muted">加载中...</td></tr></tbody>
      </table>
    </div>
    <div id="rank-paging" class="pagination"></div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
let currentType = 'week';

async function loadRankings(page = 1) {
  const res = await getJson('/points/rankings?type=' + currentType + '&page=' + page + '&limit=20');
  const el = document.getElementById('rank-body');
  if (res.code !== 0) { el.innerHTML = `<tr><td colspan="3" class="muted">${escapeHtml(res.message)}</td></tr>`; return; }
  const start = (res.data.page - 1) * res.data.limit;
  const items = res.data.items || [];
  el.innerHTML = items.length ? items.map((r, i) => {
    const rank = start + i + 1;
    const rankClass = rank === 1 ? 'rank-gold' : (rank === 2 ? 'rank-silver' : (rank === 3 ? 'rank-bronze' : ''));
    return `<tr><td class="${rankClass}">${rank}</td><td>${escapeHtml(r.nickname)}</td><td class="text-success">${r.score}</td></tr>`;
  }).join('') : '<tr><td colspan="3" class="muted">暂无数据</td></tr>';
  renderPagination('rank-paging', res.data.page, res.data.limit, res.data.total, loadRankings);
}

document.querySelectorAll('.tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentType = t.dataset.type;
    loadRankings();
  });
});

document.addEventListener('DOMContentLoaded', () => loadRankings(1));
</script>
</body>
</html>
