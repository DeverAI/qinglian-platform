<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注册 - 青联合规监督社区</title>
<link rel="stylesheet" href="/static/common.css">
</head>
<body>
<header>
  <nav id="mainNav">
    <a href="/" class="nav-brand">
      <svg width="22" height="22" viewBox="0 0 64 64" aria-hidden="true">
        <defs>
          <linearGradient id="navLogoGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0" stop-color="#1e3a8a"/>
            <stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <path fill="url(#navLogoGrad)" d="M32 4 L56 14 V32 C56 46 46 56 32 60 C18 56 8 46 8 32 V14 Z"/>
        <circle cx="32" cy="26" r="5" fill="#fff"/>
        <circle cx="20" cy="40" r="2.6" fill="#fff"/>
        <circle cx="44" cy="40" r="2.6" fill="#fff"/>
        <path d="M32 31 L20 40 L32 46 L44 40 Z" fill="none" stroke="#fff" stroke-width="2"/>
      </svg>
      <span>青联合规监督社区</span>
    </a>
    <button class="nav-toggle" id="navToggle" aria-label="菜单">
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
    </button>
    <div class="nav-links" id="navLinks">
      <a href="/">首页</a>
      <a href="/login.html">登录</a>
      <a href="/disclaimer.html">免责声明</a>
      <span id="nav-user"></span>
    </div>
  </nav>
</header>
<div class="container anim-in">
  <div style="max-width:460px;margin:2rem auto;">
    <div class="page-header">
      <div class="page-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/>
          <circle cx="8.5" cy="7" r="4"/>
          <line x1="20" y1="8" x2="20" y2="14"/>
          <line x1="23" y1="11" x2="17" y2="11"/>
        </svg>
      </div>
      <div>
        <h1>注册账号</h1>
        <div class="page-subtitle">加入青联合规监督社区</div>
      </div>
    </div>
    <div class="form-card">
      <form id="register-form">
        <div class="form-section">
          <label for="email">邮箱</label>
          <input type="email" id="email" placeholder="请输入邮箱" required>
        </div>
        <div class="form-section">
          <label for="password">密码</label>
          <input type="password" id="password" placeholder="密码（至少 8 位）" required minlength="8">
        </div>
        <div class="form-section">
          <label for="nickname">昵称</label>
          <input type="text" id="nickname" placeholder="请输入昵称" required minlength="2">
        </div>
        <div class="form-section">
          <label class="checkbox-row">
            <input type="checkbox" id="guardian" required>
            <span>我已确认：如未满 18 岁，注册使用须已获监护人知情同意。</span>
          </label>
        </div>
        <div class="btn-group">
          <button type="submit" class="btn btn-primary">注册</button>
        </div>
        <p class="muted">已有账号？<a href="/login.html">登录</a></p>
        <p id="msg"></p>
      </form>
    </div>
  </div>
</div>
<script src="/static/common.js"></script>
<script>
document.getElementById('register-form').addEventListener('submit', async (e) => {
  e.preventDefault();
  const res = await postJson('/auth/register', {
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
    nickname: document.getElementById('nickname').value,
    guardian_declared: document.getElementById('guardian').checked,
    device_fingerprint: deviceFingerprint(),
  }, false);
  if (res.code === 0) {
    setToken(res.data.access_token);
    setRefreshToken(res.data.refresh_token);
    setCsrf(res.data.csrf_token);
    if (res.data.sid) setSid(res.data.sid);
    setUser(res.data.user);
    showToast('注册成功，正在跳转...', 'success');
    setTimeout(() => { location.href = '/'; }, 600);
  } else {
    showToast(res.message, 'error');
  }
});
</script>
</body>
</html>
