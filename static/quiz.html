</header>
<div class="container">

  <div class="card quiz-page-card">
    <div class="quiz-page-header">
      <h1 class="quiz-page-title">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--primary)" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 11l3 3L22 4"/>
          <path d="M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11"/>

        条文背诵挑战
      </h1>
      <div class="quiz-today" id="quizToday">加载中...</div>
    </div>

    <div class="quiz-rules">
      <strong>规则：</strong>从法律知识库随机抽取条款挖空，4 选 1 选择题。答对 +1 积分，每日上限 5 题；答错不扣分但本题不再计分。
    </div>

    <div class="quiz-area" id="quizQuestion">
      <div class="quiz-loading"><span class="spin"></span> 加载题目...</div>
    </div>

    <div class="quiz-feedback-area" id="quizFeedback"></div>

    <div class="quiz-actions">
      <button class="btn btn-primary" onclick="loadQuizQuestion()">下一题</button>
      <a class="btn btn-ghost" href="/knowledge.html">查看法律知识库</a>
    </div>
  </div>

</div>
<script src="/static/common.js"></script>
<script>
document.addEventListener('DOMContentLoaded', () => {
  updateNav();
  applyModuleSwitches();
  loadQuizQuestion();
  loadQuizToday();

  // 移动端导航折叠
});
